name: CI

# Runs the desktop unit suite on every push and pull request. The suite is the
# ground-truth signal for agentic changes to this codebase, so it must stay green.
on:
  push:
    branches: [master, main, release]
  pull_request:

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # Skip the native SQLite build, but initialize Electron's module entry point.
      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild electron

      - name: Run unit tests
        run: npm test
